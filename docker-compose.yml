services:
  postgres:
    image: postgres:16
    container_name: evolution_postgres_v2 #sempre mude esse nome para algo novo
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: agrominas_redis_v2 #sempre mude esse nome para algo novo
    restart: always
    ports:
      - "6380:6379"

  evolution:
    image: evoapicloud/evolution-api:v2.3.6
    container_name: evolution_agrominas
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # Força a autenticação correta
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      # Força a conexão com o Redis sem erro de parsing
      - REDIS_ENABLED=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution

volumes:
  postgres_data:
